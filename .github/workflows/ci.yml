name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Check API syntax
        run: |
          node --check api/app.js
          node --check api/auth-rate-limit.js
          node --check api/idempotency.js

      - name: Audit production dependencies
        working-directory: api
        run: npm audit --omit=dev --audit-level=high

      - name: Run API unit tests
        working-directory: api
        run: npm test

      - name: Enforce API coverage
        working-directory: api
        run: npm run test:coverage

  frontend:
    name: Frontend lint, unit tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Type-check frontend tests
        working-directory: frontend
        run: npx tsc -p src/tsconfig.spec.json --noEmit

      - name: Test Vercel API proxy
        working-directory: frontend
        run: npm run test:proxy

      - name: Run frontend unit and coverage tests
        working-directory: frontend
        run: npm run test:coverage -- --no-progress

      - name: Build production frontend
        working-directory: frontend
        run: npm run build -- --configuration production

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: API and browser integration tests
    needs: [api, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      JWT_SECRET: ci-only-secret
      MONGO_URI: mongodb://127.0.0.1:27017/TaskManagerCI
      ALLOWED_ORIGINS: http://localhost:4200

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            frontend/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright API and browser tests
        working-directory: frontend
        run: npm run e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
