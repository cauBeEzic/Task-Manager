<div class="editor-page">
  <section class="editor-card" aria-labelledby="new-task-title">
    <div class="editor-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><path d="M7 3.75h10A2.25 2.25 0 0 1 19.25 6v12A2.25 2.25 0 0 1 17 20.25H7A2.25 2.25 0 0 1 4.75 18V6A2.25 2.25 0 0 1 7 3.75Z" stroke="currentColor" stroke-width="1.8"/><path d="M8.5 9.25h7M8.5 13h7M8.5 16.75h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </div>
    <header class="editor-heading">
      <span class="eyebrow">New field action</span>
      <h1 id="new-task-title" class="title">Create a new task</h1>
      <p>Add one clear, actionable item to the selected list.</p>
    </header>

    <form (ngSubmit)="createTask(taskTitleInput.value)">
      <label class="app-field-label" for="new-task-name">Task name</label>
      <input #taskTitleInput id="new-task-name" name="taskTitle" class="input is-medium" type="text" autocomplete="off" placeholder="Enter task name..." required>
      <div class="editor-actions">
        <button class="button is-medium" type="button" [routerLink]="['/lists', listId]">Cancel</button>
        <button class="button is-primary is-medium" type="submit">Create</button>
      </div>
    </form>
  </section>
</div>
