<div class="editor-page">
  <section class="editor-card" aria-labelledby="edit-list-title">
    <div class="editor-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><path d="m14.5 5.5 4 4M4.75 19.25l3.9-.8L19.2 7.9a1.7 1.7 0 0 0 0-2.4l-.7-.7a1.7 1.7 0 0 0-2.4 0L5.55 15.35l-.8 3.9Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <header class="editor-heading">
      <span class="eyebrow">List settings</span>
      <h1 id="edit-list-title" class="title">Edit list</h1>
      <p>Rename this workspace without changing any of its tasks.</p>
    </header>

    <form (ngSubmit)="updateList(listTitleInput.value)">
      <label class="app-field-label" for="edit-list-name">List name</label>
      <input #listTitleInput id="edit-list-name" name="listTitle" class="input is-medium" type="text" autocomplete="off" placeholder="Enter list name..." required>
      <div class="editor-actions">
        <button class="button is-medium" type="button" [routerLink]="['/lists', listId]">Cancel</button>
        <button class="button is-primary is-medium" type="submit">Save</button>
      </div>
    </form>
  </section>
</div>
